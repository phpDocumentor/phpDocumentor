on:
  push:
    branches:
      - master
    paths:
      - 'extensions/GuidesDirectives/**'
      - 'src/phpDocumentor/Extension/**'
      - 'src/phpDocumentor/Guides/**'
      - 'src/phpDocumentor/Descriptor/**'
      - 'src/phpDocumentor/Query/**'
      - '.github/workflows/extension-guides-directives.yml'
  pull_request:
    paths:
      - 'extensions/GuidesDirectives/**'
      - 'src/phpDocumentor/Extension/**'
      - 'src/phpDocumentor/Guides/**'
      - 'src/phpDocumentor/Descriptor/**'
      - 'src/phpDocumentor/Query/**'
      - '.github/workflows/extension-guides-directives.yml'
  workflow_dispatch:
name: Extension - GuidesDirectives

env:
  extensions: mbstring, intl, iconv, libxml, dom, json, simplexml, zlib, fileinfo
  key: cache-v1
  defaultPHPVersion: '8.1'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup cache environment
        id: cache-env
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ env.defaultPHPVersion }}
          extensions: ${{ env.extensions }}
          key: ${{ env.key }}

      - name: Cache extensions
        uses: actions/cache@v6
        with:
          path: ${{ steps.cache-env.outputs.dir }}
          key: ${{ steps.cache-env.outputs.key }}
          restore-keys: ${{ steps.cache-env.outputs.key }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.defaultPHPVersion }}
          extensions: ${{ env.extensions }}
          ini-values: memory_limit=2G, display_errors=On, error_reporting=-1

      - name: Install Composer dependencies & cache dependencies
        uses: "ramsey/composer-install@v4"
        with:
          composer-options: --optimize-autoloader

      - name: Run the extension's PHPUnit suite
        run: ./bin/phpunit -c extensions/GuidesDirectives/phpunit.xml.dist --no-coverage

  e2e:
    name: E2E (composer install + Cypress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup cache environment
        id: cache-env
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ env.defaultPHPVersion }}
          extensions: ${{ env.extensions }}
          key: ${{ env.key }}

      - name: Cache extensions
        uses: actions/cache@v6
        with:
          path: ${{ steps.cache-env.outputs.dir }}
          key: ${{ steps.cache-env.outputs.key }}
          restore-keys: ${{ steps.cache-env.outputs.key }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.defaultPHPVersion }}
          extensions: ${{ env.extensions }}
          ini-values: memory_limit=2G, display_errors=On, error_reporting=-1
          tools: composer:v2

      - name: Install phpDocumentor's own Composer dependencies
        uses: "ramsey/composer-install@v4"
        with:
          composer-options: --optimize-autoloader

      - name: Install the extension into the fixture project via Composer
        working-directory: extensions/GuidesDirectives/tests/e2e/fixture-project
        run: composer install --no-interaction

      - name: Build the fixture project's docs
        working-directory: extensions/GuidesDirectives/tests/e2e/fixture-project
        run: ../../../../../bin/phpdoc --config=phpdoc.xml --target=${{ github.workspace }}/build/guides-directives --force -vvv

      - name: Test the rendered output using Cypress
        uses: cypress-io/github-action@v7
        with:
          spec: extensions/GuidesDirectives/tests/e2e/cypress/integration/*.spec.js
